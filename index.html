<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a1b"><title>HANT — KPI Workspace</title>
<style>
:root{--bg:#101a1b;--panel:#172526;--panel2:#203332;--line:#2c4240;--ink:#edf4ec;--muted:#9aadaa;--lime:#c9f36b;--mint:#8bd7b2;--red:#ff827a;--gold:#f1c879;--shadow:0 18px 50px #06101066}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% -10%,#29413b 0%,transparent 65%),var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1220px;margin:auto;padding:22px 24px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:var(--lime);color:#17221b;display:grid;place-items:center;font-weight:950;font-size:20px}.brand b{letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.tools{display:flex;gap:8px}.btn,.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:9px 13px}.btn.primary{background:var(--lime);color:#17221b;border-color:var(--lime);font-weight:850}.btn.danger{color:var(--red)}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px}.side{position:sticky;top:18px;height:max-content;display:grid;gap:7px}.side small{color:var(--muted);letter-spacing:2px;font-size:10px;margin:10px}.tab{text-align:left;border-color:transparent;background:transparent;color:var(--muted)}.tab.active{background:#c9f36b16;color:var(--lime);border-color:#c9f36b30}.main{min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 20px}.eyebrow{color:var(--mint);font-size:10px;letter-spacing:2px;font-weight:850}.head h1{font-size:clamp(25px,4vw,36px);letter-spacing:-1.5px;margin:5px 0 0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{background:linear-gradient(145deg,#1b2b2b,#152323);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{min-height:118px}.stat small{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.7px}.stat strong{display:block;font-size:clamp(18px,2.5vw,26px);letter-spacing:-1px;margin:12px 0 3px;overflow-wrap:anywhere}.stat em{font-style:normal;color:var(--mint);font-size:11px}.hero{grid-template-columns:1.25fr .75fr;margin-bottom:14px}.heroMain{background:linear-gradient(120deg,#263d37,#1c302e 65%,#273c2e);border-color:#49624a}.big{font-size:clamp(42px,7vw,62px);font-weight:900;letter-spacing:-3px;line-height:1.1;margin:13px 0}.foot{display:flex;gap:20px;flex-wrap:wrap;color:#c1cfbf;font-size:11px}.foot b{color:var(--ink)}.ring{width:126px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:conic-gradient(var(--lime) var(--p),#ffffff15 0);position:relative}.ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#1b302c}.ring div{z-index:1;text-align:center}.ring strong{display:block;font-size:23px}.ring small{font-size:10px;color:var(--muted)}.two{grid-template-columns:1fr 1fr}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:23px 0 11px}.section h2{font-size:16px;margin:0}.section span{font-size:11px;color:var(--muted)}.bar{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;margin:14px 0;font-size:12px}.track{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--lime))}.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.line:last-child{border:0}.line span{color:var(--muted)}.good{color:var(--lime)}.warn{color:var(--gold)}.bad{color:var(--red)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}.table th{font-size:10px;color:var(--muted);letter-spacing:1px}.table input,.table select,.field input{width:100%;min-width:0;background:#0e1919;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{padding:12px;border:1px solid #c9f36b2b;background:#c9f36b0d;border-radius:13px;color:#c6d4c2;font-size:11px;margin:14px 0}.empty{text-align:center;padding:25px;color:var(--muted)}.hidden{display:none!important}.mobile{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--lime);color:#17221b;padding:11px 16px;border-radius:99px;font-weight:850;z-index:9}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;background:#111d1df2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}.mobile .tab{display:grid;justify-items:center;padding:7px;font-size:10px}.app{padding:15px 14px 100px}.hero{grid-template-columns:1fr}.ring{width:88px;margin:0}.ringCard{display:flex;align-items:center;gap:16px}.tools .optional{display:none}}
@media(max-width:520px){.two{grid-template-columns:1fr}.card{padding:14px}.head{align-items:flex-start}.form{grid-template-columns:1fr}.big{font-size:46px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="mark">H.</div><div><b>HANT / KPI</b><small>PERSONAL PERFORMANCE OS</small></div></div><div class="tools"><button class="btn optional" id="undo">↶</button><button class="btn optional" id="redo">↷</button><button class="btn primary" id="backup">Xuất dữ liệu ↗</button></div></header><div class="layout"><aside class="side"><small>WORKSPACE</small><button class="tab active" data-page="home">◫　Tổng quan</button><button class="tab" data-page="income">↗　Thu hồi</button><button class="tab" data-page="ntu">◎　Hồ sơ NTU</button><button class="tab" data-page="settings">⚙　Cấu hình</button><div class="card" style="margin-top:20px"><b>◈ Local-first</b><p class="muted">Dữ liệu lưu trên trình duyệt. Hãy sao lưu định kỳ.</p></div></aside><main class="main" id="main"></main></div></div><nav class="mobile"><button class="tab active" data-page="home">◫<br>Tổng quan</button><button class="tab" data-page="income">↗<br>Thu hồi</button><button class="tab" data-page="ntu">◎<br>NTU</button><button class="tab" data-page="settings">⚙<br>Cấu hình</button></nav><div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
var KEY='hant-kpi-v1',main=document.getElementById('main'),page='home',hist=[],redo=[];
var B1=[[0,.15],[.5,.2],[.7,.25],[.8,.4],[1,.6],[1.1,.8],[1.2,1]],B2=[[0,.4],[.3,.5],[.6,.6],[.8,.7],[1,.8]],B3=[[0,0],[.8,.05],[.9,.075],[1,.105],[1.05,.115],[1.1,.1194],[1.15,.1268],[1.2,.1341],[1.25,.1425],[1.3,.155],[1.4,.1675],[1.5,.18]],TAX=[[0,.05],[1e7,.10],[3e7,.20],[6e7,.30],[1e8,.35]];
var K=[['Thu kỳ',1,.7],['Thu quá hạn',1.1,1.1],['Thanh lý B3',1.5,1.3],['Thanh lý B4',1.5,1.32],['Thanh lý B5',1.5,1.34],['Thanh lý B6',1.5,1.36],['Thanh lý B7',1.5,1.38],['Thanh lý B8',1.5,1.4],['Thanh lý B9',1.5,1.42],['Thanh lý B10',1.5,1.44],['Thanh lý B11',1.5,1.46],['Thanh lý B12',1.5,1.48],['Thanh lý COF',1.5,1.5]];
function seed(){return{month:'Tháng hiện tại',name:'',targetCof:31640242,targetNon:48535835,targetNtu:9,ntuOK:3,wC:.4,wN:.6,fixed:7100000,dep:2,bhxh:557550,notFull:.8,r85:.85,r80:.8,cust:[],ntu:[]}}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
function n(v){var x=Number(String(v==null?'':v).replace(/[^\d.-]/g,''));return isFinite(x)?x:0}
function money(x){return Math.round(x||0).toLocaleString('vi-VN')+' đ'}function pct(x,d){return ((x||0)*100).toFixed(d==null?1:d).replace('.',',')+'%'}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function look(a,x){var v=a[0][1];a.forEach(function(r){if(x>=r[0])v=r[1]});return v}
function status(r){if(n(r.tien)<=0)return'Chưa thu';if(n(r.pos)>0&&n(r.tien)>=n(r.pos))return'Tất toán';return n(r.tien)>=n(r.mind)?'Đạt mindue':'Chưa đạt'}
function pos(c){if(c.onlyPos)return n(c.amount)*n(c.coef);var k=K.filter(function(x){return x[0]===c.kind})[0]||K[0];if(c.kind==='Ngoại lệ')return n(c.cof)*n(c.hc||1)+n(c.non)*n(c.hn||1);return n(c.cof)*k[1]+n(c.non)*k[2]}
function calc(){var o={cof:0,non:0,pos:0,nPos:0,nPosThu:0,nTien:0,nResp:0,okN:0,miss:0};S.cust.forEach(function(c){o.cof+=n(c.cof);o.non+=n(c.non);o.pos+=pos(c)});S.ntu.forEach(function(r){o.nPos+=n(r.pos);o.nPosThu+=n(r.posThu);o.nTien+=n(r.tien);if(r.he!==''&&r.he!=null)o.nResp+=n(r.tien)*n(r.he);else if(n(r.tien)>0)o.miss++;if(status(r)==='Đạt mindue'||status(r)==='Tất toán')o.okN++});o.i85=o.nPos*S.r85;o.i80=o.i85*S.r80;o.j85=o.i85?o.nPosThu/o.i85:0;o.j80=o.i80?o.nPosThu/o.i80:0;o.pCof=S.targetCof?o.cof/S.targetCof:0;o.pNon=S.targetNon?o.non/S.targetNon:0;o.pTien=S.wC*o.pCof+S.wN*o.pNon;o.pNtu=S.targetNtu?S.ntuOK/S.targetNtu:0;o.kqNtu=o.pNtu*look(B1,o.pTien);o.kqTien=o.pTien*look(B2,o.pNtu);o.total=o.kqNtu+o.kqTien;o.rate=look(B3,o.total);o.full=o.j80>=1;o.resp=o.j85>=1;o.bonus=o.pos*o.rate*(o.full?1:S.notFull);o.respPay=o.resp?o.nResp:0;o.tong=o.bonus+S.fixed+o.respPay;var ded=15500000+6200000*S.dep+S.bhxh,taxable=Math.max(0,o.tong-ded);o.tax=0;TAX.forEach(function(t,i){var prev=i?TAX[i-1][1]:0;if(taxable>t[0])o.tax+=(taxable-t[0])*(t[1]-prev)});o.tax=Math.round(o.tax);o.thuc=o.tong-o.tax;return o}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function snap(){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();redo=[]}
function mutate(fn){snap();fn();save();render()}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(function(){e.classList.add('hidden')},2200)}
function bar(label,v){return '<div class="bar"><b>'+label+'</b><div class="track"><i style="width:'+Math.max(0,Math.min(100,v*100))+'%"></i></div><b>'+pct(v)+'</b></div>'}
function stat(label,value,sub){return '<div class="card stat"><small>'+label+'</small><strong>'+value+'</strong><em>'+sub+'</em></div>'}
function head(k,t,btn){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1></div>'+(btn||'')+'</div>'}
function home(){var o=calc();return head('PERFORMANCE BRIEF','Chào '+esc(S.name||'bạn')+' 👋','<button class="btn primary" data-go="income">+ Ghi nhận thu</button>')+'<div class="grid stats">'+stat('TỔNG THU COF',money(o.cof),pct(o.pCof)+' mục tiêu')+stat('TỔNG THU NON',money(o.non),pct(o.pNon)+' mục tiêu')+stat('POS QUY ĐỔI',money(o.pos),'Bonus '+pct(o.rate,2))+stat('NTU CIC ĐẠT',o.okN+' / '+S.targetNtu,pct(o.pNtu)+' hoàn thành')+'</div><div class="grid hero"><section class="card heroMain"><div class="eyebrow">COMPOSITE KPI SCORE</div><div class="big">'+pct(o.total,1)+'</div><div class="muted">'+(o.total>=1?'Đã vượt mục tiêu':o.total>=.8?'Đang tiến gần mục tiêu':'Còn dư địa để bứt tốc')+'</div><hr style="border:0;border-top:1px solid #ffffff20;margin:18px 0"><div class="foot"><span>Bonus <b>'+pct(o.rate,2)+'</b></span><span>POS <b>'+money(o.pos)+'</b></span><span>NTU đạt <b>'+o.okN+'</b></span></div></section><section class="card ringCard"><div><div class="eyebrow">TARGET COMPLETION</div><div class="ring" style="--p:'+Math.max(0,Math.min(100,o.total*100))+'%"><div><strong>'+pct(o.total,0)+'</strong><small>điểm KPI</small></div></div><div class="muted">'+esc(S.month)+'</div></div></section></div><div class="grid two"><section class="card"><div class="section"><h2>Tiến độ thu hồi</h2><span>COF / NON</span></div>'+bar('COF',o.pCof)+bar('NON',o.pNon)+'<div class="line"><span>Tổng thu</span><b>'+money(o.cof+o.non)+'</b></div><div class="line"><span>Chỉ tiêu</span><b>'+money(S.targetCof+S.targetNon)+'</b></div></section><section class="card"><div class="section"><h2>Thu nhập dự kiến</h2><span class="good">SAU THUẾ</span></div><div style="font-size:30px;font-weight:900;color:var(--lime);margin:10px 0">'+money(o.thuc)+'</div><div class="line"><span>Bonus</span><b>'+money(o.bonus)+'</b></div><div class="line"><span>Khoản cố định</span><b>'+money(S.fixed)+'</b></div><div class="line"><span>Trách nhiệm NTU</span><b>'+money(o.respPay)+'</b></div><div class="line"><span>Thuế TNCN</span><b class="bad">− '+money(o.tax)+'</b></div></section></div><div class="section"><h2>Điều kiện thưởng</h2><span>Kiểm tra tự động</span></div><div class="grid two"><section class="card"><div class="line"><span>Điều kiện 100% bonus</span><b class="'+(o.full?'good':'warn')+'">'+(o.full?'ĐẠT':'CHƯA ĐẠT')+'</b></div><div class="big" style="font-size:27px">'+pct(o.j80)+'</div>'+bar('Tiến độ',o.j80)+'</section><section class="card"><div class="line"><span>Trách nhiệm NTU</span><b class="'+(o.resp?'good':'warn')+'">'+(o.resp?'ĐẠT':'CHƯA ĐẠT')+'</b></div><div class="big" style="font-size:27px">'+pct(o.j85)+'</div>'+bar('Tiến độ',o.j85)+'</section></div><div class="notice">Bản HANT độc lập · dữ liệu lưu trên trình duyệt · chưa kết nối Google Sheets.</div>'}
function income(){var rows=S.cust.map(function(c,i){return '<tr><td><input data-c="'+i+'" data-f="name" value="'+esc(c.name)+'" placeholder="Tên khách"></td><td><select data-c="'+i+'" data-f="kind">'+K.map(function(k){return '<option '+(c.kind===k[0]?'selected':'')+'>'+k[0]+'</option>'}).join('')+'<option '+(c.kind==='Ngoại lệ'?'selected':'')+'>Ngoại lệ</option></select></td><td><input data-c="'+i+'" data-f="cof" value="'+(c.cof||'')+'" inputmode="numeric"></td><td><input data-c="'+i+'" data-f="non" value="'+(c.non||'')+'" inputmode="numeric"></td><td>'+money(pos(c))+'</td><td><button class="btn danger" data-delc="'+i+'">Xóa</button></td></tr>'}).join('');return head('COLLECTION DESK','Quản lý thu hồi','<button class="btn primary" id="addC">+ Thêm khoản</button>')+'<section class="card"><div class="section"><h2>Danh sách khoản thu</h2><span>'+S.cust.length+' dòng</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Khách hàng</th><th>Loại thu</th><th>COF</th><th>NON</th><th>POS quy đổi</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="empty">Chưa có khoản thu.</td></tr>')+'</tbody></table></div><div class="notice">Hệ số POS áp dụng theo loại thu. Dòng ngoại lệ mặc định hệ số 1; có thể tinh chỉnh trong dữ liệu ở phiên bản tiếp theo.</div></section>'}
function ntu(){var rows=S.ntu.map(function(r,i){return '<tr><td><input data-n="'+i+'" data-f="hd" value="'+esc(r.hd)+'"></td><td><input data-n="'+i+'" data-f="name" value="'+esc(r.name)+'"></td><td><input data-n="'+i+'" data-f="pos" value="'+(r.pos||'')+'" inputmode="numeric"></td><td><input data-n="'+i+'" data-f="mind" value="'+(r.mind||'')+'" inputmode="numeric"></td><td><input data-n="'+i+'" data-f="tien" value="'+(r.tien||'')+'" inputmode="numeric"></td><td class="'+(status(r)==='Chưa đạt'?'warn':'good')+'">'+status(r)+'</td><td><button class="btn danger" data-deln="'+i+'">Xóa</button></td></tr>'}).join('');var o=calc();return head('NTU PIPELINE','Theo dõi hồ sơ NTU','<button class="btn primary" id="addN">+ Thêm hồ sơ</button>')+'<div class="grid stats">'+stat('TỔNG POS NTU',money(o.nPos),'Tổng POS hồ sơ')+stat('POS ĐÃ THU',money(o.nPosThu),'Đạt mindue')+stat('TIỀN ĐÃ THU',money(o.nTien),'Tổng tiền vào')+stat('CIC OK',S.ntuOK+' / '+S.targetNtu,pct(o.pNtu))+'</div><section class="card"><div class="section"><h2>Danh sách hồ sơ</h2><span>'+S.ntu.length+' hồ sơ</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Số HĐ</th><th>Khách hàng</th><th>POS</th><th>Mindue</th><th>Tiền thu</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">Chưa có hồ sơ NTU.</td></tr>')+'</tbody></table></div></section>'}
function settings(){var fields=[['month','Tên kỳ'],['name','Tên nhân viên'],['targetCof','Target COF (đ)'],['targetNon','Target NON (đ)'],['targetNtu','Target NTU'],['ntuOK','NTU CIC OK'],['fixed','Khoản cố định (đ)'],['dep','Người phụ thuộc'],['bhxh','BHXH/BHYT/BHTN trừ (đ)'],['notFull','Bonus khi chưa đủ điều kiện'],['r85','Ngưỡng trách nhiệm NTU'],['r80','Ngưỡng 100% bonus']];return head('WORKSPACE SETTINGS','Cấu hình kỳ KPI')+'<section class="card"><div class="section"><h2>Thông tin & chỉ tiêu</h2><span>LOCAL</span></div><div class="form">'+fields.map(function(f){return '<label class="field">'+f[1]+'<input id="s-'+f[0]+'" value="'+esc(S[f[0]])+'"></label>'}).join('')+'</div><div class="actions"><button class="btn primary" id="saveSet">Lưu cấu hình</button></div><div class="notice">Bảng hệ số B1/B2/B3 và bảng thuế đang được giữ theo logic tham chiếu từ dự án Hanh KPI. Hãy đối chiếu chính sách nội bộ trước khi dùng để chốt thu nhập.</div></section><div class="section"><h2>Sao lưu dữ liệu</h2></div><section class="card"><p class="muted">Xuất JSON để lưu trữ hoặc nhập file đã xuất trước đó.</p><div class="actions"><button class="btn" id="export">Tải bản sao lưu</button><label class="btn" for="import">Nhập bản sao lưu</label><input id="import" class="hidden" type="file" accept="application/json"><button class="btn danger" id="reset">Tạo dữ liệu mới</button></div></section>'}
function render(){main.innerHTML=page==='home'?home():page==='income'?income():page==='ntu'?ntu():settings();document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)})}
function go(p){page=p;render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){var t=e.target.closest('button,label');if(!t)return;if(t.dataset.page){go(t.dataset.page);return}if(t.dataset.go){go(t.dataset.go);return}
if(t.id==='addC'){mutate(function(){S.cust.push({name:'',kind:'Thu kỳ',cof:0,non:0})})}
if(t.id==='addN'){mutate(function(){S.ntu.push({hd:'',name:'',pos:0,mind:0,tien:0,posThu:0,he:.05})})}
if(t.dataset.delc!=null){mutate(function(){S.cust.splice(+t.dataset.delc,1)})}
if(t.dataset.deln!=null){mutate(function(){S.ntu.splice(+t.dataset.deln,1)})}
